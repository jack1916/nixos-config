name: "Nix CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: does the flake evaluate and do the configs parse?
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check flake
        run: nix flake check --no-build
      - name: Evaluate both hosts
        run: |
          nix eval --raw .#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath > /dev/null
          nix eval --raw .#nixosConfigurations.vps.config.system.build.toplevel.drvPath > /dev/null
          echo "both hosts evaluate"

  # The real gate: actually BUILD both systems. A flake.lock update that
  # bumps a dependency into a broken state fails here rather than on the
  # machines at 03:00.
  build:
    runs-on: ubuntu-latest
    needs: eval
    strategy:
      fail-fast: false
      matrix:
        host: [homeserver, vps]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # Report what would change, so a flake.lock PR shows the nixpkgs delta.
  report:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Summarise pinned revisions
        run: |
          {
            echo "## Pinned inputs"
            echo
            echo '```'
            nix flake metadata --json \
              | jq -r '.locks.nodes | to_entries[]
                       | select(.key != "root")
                       | "\(.key): \(.value.locked.rev // "n/a") (\(.value.locked.ref // .value.locked.type))"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
