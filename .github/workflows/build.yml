name: "Nix CI"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Fast feedback: does the flake evaluate and do the configs parse?
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Check workflow shell syntax
        run: ./scripts/check-workflows.sh

      - name: Check flake
        run: nix flake check --no-build
      - name: Evaluate the homeserver
        run: |
          nix eval --raw .#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath > /dev/null
          echo "homeserver evaluates"

  # The real gate: actually BUILD the system. A flake.lock update that
  # bumps a dependency into a broken state fails here rather than on the
  # machine at 03:00.
  build:
    runs-on: ubuntu-latest
    needs: eval
    strategy:
      fail-fast: false
      matrix:
        host: [homeserver]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build ${{ matrix.host }}
        run: |
          nix build --no-link --print-out-paths \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  # No pinned-revision report job: it only ran on pull_request, and the
  # update flow commits to main directly. update-flake.yml already emits
  # that summary when it changes the lock.
