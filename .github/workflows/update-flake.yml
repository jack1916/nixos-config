name: Update Flake Lock

on:
  schedule:
    # Daily 02:00 UTC. Machines pull at 03:00 local, so patches land within
    # roughly 24h of upstream. Running daily is safe because the build gate
    # below means a broken update fails the workflow instead of shipping.
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Push with the default token; needs contents: write above.
          persist-credentials: true

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Detect whether anything changed
        id: changed
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock already current; nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # THE GATE. If a dependency bump breaks either host, this fails and
      # nothing is committed. Machines therefore never see an untested lock.
      - name: Build both hosts
        if: steps.changed.outputs.changed == 'true'
        run: |
          nix build --no-link \
            .#nixosConfigurations.homeserver.config.system.build.toplevel
          nix build --no-link \
            .#nixosConfigurations.vps.config.system.build.toplevel

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock ($(date -u +%Y-%m-%d))"
          git push
